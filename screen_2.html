<div style="width:1280px;height:1000px;box-sizing:border-box;background:#F6F5F1;color:#16181D;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;position:relative">
  <div style="height:64px;background:#FFFFFF;border-bottom:1px solid #DDDACF;display:flex;align-items:center;padding:0 32px;gap:32px">
    <div style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px"><div style="width:30px;height:30px;border-radius:8px;background:#0F766E;color:#FFFFFF;display:flex;align-items:center;justify-content:center">T</div>TeamForge</div>
    <div style="display:flex;gap:8px;flex:1">
      <a href="#" style="padding:8px 14px;border-radius:8px;background:#E3F1EE;color:#0B5F58;font-weight:600;font-size:15px;text-decoration:none">Board</a>
      <a href="#" style="padding:8px 14px;border-radius:8px;color:#33373E;font-weight:500;font-size:15px;text-decoration:none">My team</a>
      <a href="#" style="padding:8px 14px;border-radius:8px;color:#33373E;font-weight:500;font-size:15px;text-decoration:none">Suggestions</a>
      <a href="#" style="padding:8px 14px;border-radius:8px;color:#33373E;font-weight:500;font-size:15px;text-decoration:none">Race test</a>
    </div>
    <div style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#0B5F58"><span style="width:10px;height:10px;border-radius:50%;background:#16A34A;display:inline-block"></span>Live</div>
    <div style="width:36px;height:36px;border-radius:50%;background:#12302D;color:#F3F1EA;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px">AJ</div>
  </div>
  <div style="padding:32px;display:flex;flex-direction:column;gap:24px">
    <div style="display:flex;align-items:flex-end;justify-content:space-between">
      <div style="display:flex;flex-direction:column;gap:4px">
        <h1 style="margin:0;font-size:30px;font-weight:700">Looking for teammates</h1>
        <div style="font-size:15px;color:#4A4F57">Teams with open seats, updated the moment anything changes.</div>
      </div>
      <div style="display:flex;gap:12px">
        <button style="height:44px;padding:0 18px;border:1px solid #0F766E;border-radius:10px;background:#FFFFFF;color:#0B5F58;font:600 15px Inter,sans-serif">Join with code</button>
        <button style="height:44px;padding:0 18px;border:0;border-radius:10px;background:#0F766E;color:#FFFFFF;font:600 15px Inter,sans-serif">Create team</button>
      </div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div style="flex:1;min-width:280px;position:relative">
        <label for="q" style="position:absolute;left:-9999px">Search teams</label>
        <input id="q" type="search" placeholder="Search teams or skills   ( press / )" style="width:100%;height:44px;box-sizing:border-box;border:1px solid #B9B6AA;border-radius:10px;padding:0 14px;font:400 15px Inter,sans-serif;background:#FFFFFF">
      </div>
      <button style="height:44px;padding:0 16px;border:1px solid #0F766E;border-radius:22px;background:#E3F1EE;color:#0B5F58;font:600 14px Inter,sans-serif">Open seats only</button>
      <button style="height:44px;padding:0 16px;border:1px solid #B9B6AA;border-radius:22px;background:#FFFFFF;color:#33373E;font:500 14px Inter,sans-serif">Skill: any</button>
      <button style="height:44px;padding:0 16px;border:1px solid #B9B6AA;border-radius:22px;background:#FFFFFF;color:#33373E;font:500 14px Inter,sans-serif">Time zone: any</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px">
      <sc-for list="{{teams}}" as="t" hint-placeholder-count="6">
        <div style="background:#FFFFFF;border:1px solid #DDDACF;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div style="font-size:18px;font-weight:700">{{t.name}}</div>
            <div style="font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;background:{{t.badgeBg}};color:{{t.badgeFg}}">{{t.badge}}</div>
          </div>
          <div style="font-size:14px;color:#4A4F57;line-height:1.45">{{t.blurb}}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <sc-for list="{{t.skills}}" as="s" hint-placeholder-count="3">
              <span style="font-size:13px;padding:4px 10px;border-radius:8px;background:#EFEDE5;color:#33373E">{{s}}</span>
            </sc-for>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#33373E">
            <div style="display:flex;align-items:center;gap:6px">
              <sc-for list="{{t.seats}}" as="d" hint-placeholder-count="5">
                <span style="width:12px;height:12px;border-radius:50%;background:{{d.color}};display:inline-block"></span>
              </sc-for>
              <span style="margin-left:6px;font-weight:600">{{t.count}}</span>
            </div>
            <div>{{t.tz}}</div>
          </div>
          <button style="height:44px;border:0;border-radius:10px;background:{{t.btnBg}};color:{{t.btnFg}};font:600 15px Inter,sans-serif">{{t.btn}}</button>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#7A3E00;color:#FFFFFF;border-radius:12px;padding:14px 20px;font-size:15px;font-weight:500;display:flex;gap:16px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18)">
    <span>Atlas Crew filled up just before you. Your seat was released.</span>
    <button style="height:34px;padding:0 14px;border:1px solid #F5D9B8;border-radius:8px;background:transparent;color:#FFFFFF;font:600 13px Inter,sans-serif">Dismiss</button>
  </div>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1000}}">
class Component extends DCLogic {
renderVals() {
  const teal = '#0F766E', empty = '#D4D1C5';
  const mk = (name, blurb, skills, filled, max, tz, status) => {
    const seats = [];
    for (let i = 0; i < max; i++) seats.push({ color: i < filled ? teal : empty });
    const full = filled >= max;
    const ready = filled >= 3;
    return {
      name, blurb, skills, seats, tz,
      count: filled + ' / ' + max,
      badge: full ? 'Full' : (ready ? 'Ready' : 'Forming'),
      badgeBg: full ? '#E8E6DE' : (ready ? '#DCF3E4' : '#FDEBC8'),
      badgeFg: full ? '#33373E' : (ready ? '#14532D' : '#7A3E00'),
      btn: full ? 'Team full' : (status === 'req' ? 'Request pending' : 'Join team'),
      btnBg: full ? '#E8E6DE' : (status === 'req' ? '#FFFFFF' : teal),
      btnFg: full ? '#4A4F57' : (status === 'req' ? '#0B5F58' : '#FFFFFF')
    };
  };
