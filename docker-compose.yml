services:
  db:
    image: postgres:16-alpine
    container_name: raceproof_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: team_formation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d team_formation"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: raceproof_api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/team_formation
      JWT_SECRET: production-race-proof-jwt-secret-2026
      ADMIN_USERNAME: adminbro
      ADMIN_PASSWORD: DemoAdmin#2026
      SEED_DEMO_DATA: "true"
      SEED_USERS: "50000"
      SEED_TEAMS: "10000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: raceproof_web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:

