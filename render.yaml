services:
  # Fastify Monolith API + Static Client Serving
  - type: web
    name: raceproof-team-formation
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start --workspace=server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: raceproof-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: raceproof-db
    plan: free
    databaseName: team_formation
    user: postgres

