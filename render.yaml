services:
  # One Docker service serves the React client, Fastify API, and SSE endpoint.
  - type: web
    name: raceproof-app
    env: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: raceproof-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: adminbro
      - key: ADMIN_PASSWORD
        value: "DemoAdmin#2026"
      - key: PG_POOL_MAX
        value: "20"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SEED_USERS
        value: "50000"
      - key: SEED_TEAMS
        value: "10000"

databases:
  - name: raceproof-db
    plan: free
    databaseName: team_formation