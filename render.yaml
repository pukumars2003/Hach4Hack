services:
  # Fastify API (Docker). The React client is deployed to Vercel separately.
  # Set CORS_ORIGIN to the Vercel origin (or "*" while testing).
  - type: web
    name: raceproof-api
    env: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: raceproof-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: PG_POOL_MAX
        value: "20"

databases:
  - name: raceproof-db
    plan: free
    databaseName: team_formation
    user: postgres